[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["work", "models", "secrets", "bundle"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Скрипты сервиса и авторских проверок добавляют локальный scripts в sys.path.
ignore = ["E402"]

[tool.ruff.format]
docstring-code-format = true
